name: Build RealiTLScanner binaries

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 1"
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: realitlscanner-linux-amd64
            cc: gcc
          - target: aarch64-unknown-linux-gnu
            asset: realitlscanner-linux-arm64
            cc: aarch64-linux-gnu-gcc
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential pkg-config gcc-aarch64-linux-gnu
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Checkout upstream
        run: git clone --depth=1 https://github.com/spgsroot/RealiTLScanner-rs.git src
      - name: Build
        working-directory: src
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}
      - name: Prepare asset
        run: |
          cp "src/target/${{ matrix.target }}/release/realitlscanner" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest dist/* \
            --title "RealiTLScanner prebuilt binaries" \
            --notes "Automatically built from spgsroot/RealiTLScanner-rs for Linux amd64/arm64."
